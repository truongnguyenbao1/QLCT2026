name: Build and Release Windows App

on:
  push:
    tags:
      - 'v*' # Chỉ chạy khi push tag có chữ 'v' ở đầu (VD: v1.0.0, v1.0.1)

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write # Cần quyền để tạo Release và upload file

    steps:
      - name: Kiểm tra mã nguồn (Checkout)
        uses: actions/checkout@v4

      - name: Cài đặt Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Bật cache để các lần build sau nhanh hơn
          cache: true

      - name: Cài đặt dependencies (pub get)
        run: flutter pub get

      - name: Build Windows App (Release mode)
        run: flutter build windows --release

      - name: Đóng gói Inno Setup (Tạo file .exe)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: windows/inno_setup.iss
          options: /DMyAppVersion=${{ github.ref_name }}

      - name: Tạo GitHub Release & Tải file EXE lên
        uses: softprops/action-gh-release@v2
        with:
          files: windows/Output/TroKeeper_Setup.exe
          name: TroKeeper ${{ github.ref_name }}
          body: |
            Bản cập nhật Desktop (Windows .exe).
            
            **Hướng dẫn cài đặt:**
            Tải file `TroKeeper_Setup.exe` và chạy để cài đặt bình thường.
            Các bản cập nhật sau sẽ tự động thông báo và tải về từ bên trong ứng dụng.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
